<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Premium Glassmorphic Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle Horizontal Aerospace / Circuit Line -->
  <line x1="12" y1="50" x2="52" y2="50" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.35" />

  <!-- Monogram IH -->
  <text x="32" y="42" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1.5" filter="url(#glow)">IH</text>

  <!-- Radiant Star Flare at Corner -->
  <circle cx="48" cy="16" r="2.5" fill="#ffffff" />
  <path d="M48 10 L48 22 M42 16 L54 16" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="48" cy="16" r="1.2" fill="#00f0ff" opacity="0.9" />
</svg>
